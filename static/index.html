<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Days Until</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="header-meta">
      <span id="app-version" class="app-version">dev</span>
    </div>
    <h1><a class="title-link" href="https://github.com/eduardoshanahan/daysuntil.git">Days Until</a></h1>
    <div class="header-actions">
      <span id="user-badge" class="user-badge hidden"></span>
      <button id="btn-logout" type="button" class="btn-secondary hidden">Log out</button>
      <button id="btn-add" class="btn-primary hidden">+ Add</button>
    </div>
  </header>

  <section id="auth-view" class="auth-shell hidden" aria-live="polite">
    <div class="auth-card">
      <p id="auth-kicker" class="auth-kicker">Login</p>
      <h2 id="auth-title">Sign in to your account</h2>
      <p id="auth-subtitle" class="auth-subtitle">Your intervals stay private to your account.</p>

      <form id="auth-form" class="auth-form" novalidate>
        <label for="auth-username">Username</label>
        <input type="text" id="auth-username" autocomplete="username" required />

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" autocomplete="current-password" required />

        <p id="auth-error" class="form-error hidden" role="alert" aria-live="assertive"></p>

        <div class="auth-actions">
          <button id="auth-submit" type="submit" class="btn-primary">Log in</button>
        </div>
      </form>

      <div id="auth-oauth" class="auth-oauth hidden">
        <div class="auth-divider" aria-hidden="true">
          <span></span>
          <p>or</p>
          <span></span>
        </div>
        <a id="auth-github" class="btn-secondary auth-oauth-btn" href="/api/oauth/github/start">Continue with GitHub</a>
      </div>

      <p class="auth-switch-copy">
        <span id="auth-switch-label">Need an account?</span>
        <button id="auth-switch" type="button" class="btn-link">Create one</button>
      </p>
    </div>
  </section>

  <main id="app-view" class="hidden">
    <section id="public-profile-header" class="public-profile-header hidden">
      <p class="profile-kicker">Public profile</p>
      <h2 id="public-profile-name"></h2>
      <p id="public-profile-username" class="public-profile-username"></p>
    </section>

    <section id="interval-list">
      <p id="loading-msg" class="empty-msg">Loading intervals...</p>
    </section>

    <section id="profile-panel" class="profile-panel hidden">
      <div>
        <p class="profile-kicker">Public profile</p>
        <p><a id="profile-link" class="profile-link" target="_blank" rel="noopener noreferrer"></a></p>
      </div>
      <form id="profile-form" class="profile-form" novalidate>
        <label for="profile-display-name">Display name</label>
        <div class="profile-form-row">
          <input type="text" id="profile-display-name" maxlength="80" required />
          <button id="profile-save" type="submit" class="btn-secondary">Save</button>
        </div>
        <p id="profile-error" class="form-error hidden" role="alert" aria-live="assertive"></p>
      </form>
    </section>
  </main>

  <section id="app-status" class="app-status hidden" role="status" aria-live="polite">
    <p id="status-message"></p>
    <button id="btn-retry" type="button" class="btn-secondary hidden">Retry</button>
  </section>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <div class="modal">
      <h2 id="modal-title">Add Interval</h2>
      <form id="interval-form" novalidate>
        <input type="hidden" id="field-id" />
        <label for="field-name">Name</label>
        <input type="text" id="field-name" placeholder="e.g. Summer vacation" required />

        <label for="field-start">Start date</label>
        <div class="date-input-row">
          <input type="text" id="field-start" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="off" required />
          <button type="button" id="btn-pick-start" class="btn-icon date-picker-trigger" aria-label="Pick start date">Pick</button>
        </div>

        <label for="field-end">End date</label>
        <div class="date-input-row">
          <input type="text" id="field-end" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="off" required />
          <button type="button" id="btn-pick-end" class="btn-icon date-picker-trigger" aria-label="Pick end date">Pick</button>
        </div>

        <label for="field-color">Color</label>
        <div class="color-row">
          <input type="color" id="field-color" value="#4f8ef7" aria-label="Choose custom color" />
          <span id="color-swatches" class="color-swatches">
            <button type="button" class="swatch" data-color="#4f8ef7" style="background:#4f8ef7" aria-label="Use blue color"></button>
            <button type="button" class="swatch" data-color="#e05c5c" style="background:#e05c5c" aria-label="Use red color"></button>
            <button type="button" class="swatch" data-color="#50c878" style="background:#50c878" aria-label="Use green color"></button>
            <button type="button" class="swatch" data-color="#f5a623" style="background:#f5a623" aria-label="Use orange color"></button>
            <button type="button" class="swatch" data-color="#b47cf7" style="background:#b47cf7" aria-label="Use violet color"></button>
            <button type="button" class="swatch" data-color="#40c4c4" style="background:#40c4c4" aria-label="Use teal color"></button>
            <button type="button" class="swatch" data-color="#f06292" style="background:#f06292" aria-label="Use pink color"></button>
            <button type="button" class="swatch" data-color="#8d6e63" style="background:#8d6e63" aria-label="Use brown color"></button>
            <button type="button" class="swatch" data-color="#9ccc65" style="background:#9ccc65" aria-label="Use lime color"></button>
            <button type="button" class="swatch" data-color="#ffd54f" style="background:#ffd54f" aria-label="Use amber color"></button>
            <button type="button" class="swatch" data-color="#7986cb" style="background:#7986cb" aria-label="Use indigo color"></button>
            <button type="button" class="swatch" data-color="#90a4ae" style="background:#90a4ae" aria-label="Use slate color"></button>
            <button type="button" class="swatch" data-color="#26a69a" style="background:#26a69a" aria-label="Use sea green color"></button>
            <button type="button" class="swatch" data-color="#ef5350" style="background:#ef5350" aria-label="Use coral red color"></button>
            <button type="button" class="swatch" data-color="#ab47bc" style="background:#ab47bc" aria-label="Use orchid color"></button>
            <button type="button" class="swatch" data-color="#5c6bc0" style="background:#5c6bc0" aria-label="Use royal blue color"></button>
            <button type="button" class="swatch" data-color="#29b6f6" style="background:#29b6f6" aria-label="Use sky blue color"></button>
            <button type="button" class="swatch" data-color="#ff8a65" style="background:#ff8a65" aria-label="Use peach color"></button>
            <button type="button" class="swatch" data-color="#66bb6a" style="background:#66bb6a" aria-label="Use leaf green color"></button>
            <button type="button" class="swatch" data-color="#b0bec5" style="background:#b0bec5" aria-label="Use light slate color"></button>
          </span>
        </div>

        <label for="field-visibility">Visibility</label>
        <select id="field-visibility">
          <option value="private">Private</option>
          <option value="public">Public</option>
        </select>

        <p id="form-error" class="form-error hidden" role="alert" aria-live="assertive"></p>

        <div id="date-picker" class="date-picker hidden" role="dialog" aria-modal="false" aria-label="Choose date">
          <div class="date-picker-header">
            <button type="button" id="date-prev" class="btn-icon" aria-label="Previous month">&lt;</button>
            <p id="date-picker-title" class="date-picker-title"></p>
            <button type="button" id="date-next" class="btn-icon" aria-label="Next month">&gt;</button>
          </div>
          <div class="date-picker-weekdays" aria-hidden="true">
            <span>Mo</span>
            <span>Tu</span>
            <span>We</span>
            <span>Th</span>
            <span>Fr</span>
            <span>Sa</span>
            <span>Su</span>
          </div>
          <div id="date-picker-grid" class="date-picker-grid"></div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" id="btn-save" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
