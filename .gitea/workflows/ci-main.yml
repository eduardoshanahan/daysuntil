name: Test (main)

# main never builds or deploys — see box.yml (staging) and deploy-vps.yml
# (production). Runs the server's Go tests and the web layer's JS tests
# (dates.js's date/recurrence math, in web/js/dates.test.js) on every push
# to main for fast feedback. web/ still has no build step or package.json
# (plain static HTML/JS/CSS) -- dates.test.js runs directly via node, no
# npm involved.

on:
  push:
    branches: [main]

jobs:
  server_test:
    runs-on: ci-build
    steps:
      - uses: actions/checkout@v4

      - name: Go test
        uses: https://gitea.mediumsizedrobots.com/eduardo/ci-templates/.gitea/actions/go-test@main
        with:
          working-directory: server

  web_test:
    runs-on: ci-build
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        working-directory: web
        run: node js/dates.test.js
