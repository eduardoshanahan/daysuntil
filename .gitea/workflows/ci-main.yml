name: Test (main)

# main never builds or deploys — see ci.yml (staging) and deploy-vps.yml
# (production). Runs the server's Go tests on every push to main for fast
# feedback. Web UI tests live in the daysuntil-web repo since the web/
# split into its own repo on 2026-08-05.

on:
  push:
    branches: [main]

jobs:
  server_test:
    runs-on: ci-build
    steps:
      - uses: actions/checkout@v4

      - name: Go test
        uses: https://gitea.mediumsizedrobots.com/eduardo/ci-templates/.gitea/actions/go-test@main
        with:
          working-directory: server
