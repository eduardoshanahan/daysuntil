name: Build and Push

on:
  push:
    branches: [main]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Inject homelab CA into BuildKit
        run: |
          container=$(docker ps --format '{{.Names}}' | grep buildx_buildkit | head -1)
          docker cp /etc/docker/certs.d/gitea.hhlab.home.arpa/ca.crt \
            "$container:/usr/local/share/ca-certificates/homelab-ca.crt"
          docker exec "$container" sh -c \
            'cat /usr/local/share/ca-certificates/homelab-ca.crt >> /etc/ssl/certs/ca-certificates.crt'

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.hhlab.home.arpa
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.hhlab.home.arpa/eduardo/daysuntil
          tags: |
            type=sha,prefix=,format=long,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
