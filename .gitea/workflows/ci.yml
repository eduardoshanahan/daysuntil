name: Build and Push

on:
  push:
    branches: [main, vps]
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-bundle.crt

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Inject homelab CA into BuildKit
        run: |
          container=$(docker ps --format '{{.Names}}' | grep buildx_buildkit | head -1)
          docker exec -i "$container" sh -c \
            'cat >> /etc/ssl/certs/ca-certificates.crt' \
            < /etc/ssl/certs/ca-bundle.crt

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.hhlab.home.arpa
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Compute version
        id: version
        run: |
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo '')
          if [ -n "${BASE}" ]; then
            COUNT=$(git rev-list --count "${BASE}..HEAD")
          else
            BASE="v0.0.0"
            COUNT=$(git rev-list --count HEAD)
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${COUNT}" = "0" ]; then
            VERSION="${BASE}"
          else
            VERSION="${BASE}.${COUNT}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gitea.hhlab.home.arpa/eduardo/daysuntil
          tags: |
            type=sha,prefix=,format=long,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/vps' }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}

      - name: Deploy to rpi-box-01
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            eduardo@rpi-box-01.hhlab.home.arpa \
            "docker pull gitea.hhlab.home.arpa/eduardo/daysuntil:latest && sudo systemctl restart daysuntil"
          rm -f /tmp/deploy_key

      - name: Deploy to vps-01
        if: github.ref == 'refs/heads/vps'
        run: |
          echo "${{ secrets.DAYSUNTIL_DEPLOY_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            eduardo@127.0.0.1 \
            "${{ steps.version.outputs.value }}"
          rm -f /tmp/deploy_key
