name: Promote to vps-01

# Manual trigger only. Promotes an already-built-and-staged commit SHA to
# vps-01 for both server and web — never rebuilds. Run this from Gitea's
# Actions tab ("Run workflow") after confirming the SHA is healthy on
# rpi-box-01 (staging).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA already built and verified on staging (rpi-box-01)"
        type: string
        required: true

jobs:
  promote-server:
    runs-on: ci-build
    steps:
      - name: Trigger deploy (server -> vps-01)
        run: |
          JSON_PAYLOAD='{"ref":"main","inputs":{"host":"vps-01","nix_file":"vps-01/nixos/daysuntil.nix","env_var":"DAYSUNTIL_IMAGE","image_ref":"gitea.mediumsizedrobots.com/eduardo/daysuntil:${{ inputs.sha }}","health_url":"https://daysuntil.mesorobots.com/api/version","commit_message":"daysuntil: promote ${{ inputs.sha }} to vps-01"}}'
          curl -sk -f -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://gitea.mediumsizedrobots.com/api/v1/repos/eduardo/ci-templates/actions/workflows/deploy-dispatch.yml/dispatches" \
            -d "$JSON_PAYLOAD"

  promote-web:
    runs-on: ci-build
    steps:
      - name: Trigger deploy (web -> vps-01)
        run: |
          JSON_PAYLOAD='{"ref":"main","inputs":{"host":"vps-01","nix_file":"vps-01/nixos/daysuntil-web.nix","env_var":"DAYSUNTIL_WEB_IMAGE","image_ref":"gitea.mediumsizedrobots.com/eduardo/daysuntil-web:${{ inputs.sha }}","health_url":"https://daysuntil.mesorobots.com/","commit_message":"daysuntil-web: promote ${{ inputs.sha }} to vps-01"}}'
          curl -sk -f -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://gitea.mediumsizedrobots.com/api/v1/repos/eduardo/ci-templates/actions/workflows/deploy-dispatch.yml/dispatches" \
            -d "$JSON_PAYLOAD"
