labels:
  hostname: meganix

steps:
  - name: build-and-push-main
    when:
      - event: push
        branch: main
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: gitea.hhlab.home.arpa
      repo: gitea.hhlab.home.arpa/eduardo/daysuntil
      platforms: linux/amd64,linux/arm64
      build_args:
        - APP_VERSION=${CI_COMMIT_SHA}
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username:
        from_secret: gitea_username
      password:
        from_secret: gitea_token

  - name: build-and-push-tag
    when:
      - event: tag
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: gitea.hhlab.home.arpa
      repo: gitea.hhlab.home.arpa/eduardo/daysuntil
      platforms: linux/amd64,linux/arm64
      build_args:
        - APP_VERSION=${CI_COMMIT_TAG}
      tags:
        - ${CI_COMMIT_TAG}
      username:
        from_secret: gitea_username
      password:
        from_secret: gitea_token
